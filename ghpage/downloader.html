<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytdwt - web</title>
    <link rel="icon" type="image/png" href="ytdwt.png">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 1rem;
        }

        .rate-limit {
            font-size: 0.8rem;
            color: #666;
        }

        .downloader-card {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        input[type="url"],
        select {
            width: 100%;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="url"]:focus,
        select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(40, 40, 40, 0.8);
        }

        input[type="url"]::placeholder {
            color: #555;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="checkbox"] {
            accent-color: #e0e0e0;
        }

        .download-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .download-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(20, 20, 20, 0.5);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #e0e0e0;
            transition: width 0.3s ease;
        }

        .message {
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .error {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2);
            color: #ff6b6b;
        }

        .success {
            background: rgba(50, 255, 50, 0.1);
            border: 1px solid rgba(50, 255, 50, 0.2);
            color: #51cf66;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #555;
        }

        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            z-index: 3;
        }

        .back-link:hover {
            color: #888;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .options-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .back-link {
                top: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <canvas id="hero-canvas"></canvas>
    </div>

    <a href="index.html" class="back-link">← back</a>

    <div class="container">
        <div class="header">
            <h1>ytdwt</h1>
            <p class="subtitle">web downloader</p>
            <div class="rate-limit" id="rateLimitStatus">checking rate limit...</div>
        </div>

        <div class="downloader-card">
            <div class="form-group">
                <label for="urlInput">youtube url</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="https://www.youtube.com/watch?v=..."
                    autocomplete="off"
                >
            </div>

            <div class="options-grid">
                <div class="form-group">
                    <label for="qualitySelect">quality</label>
                    <select id="qualitySelect">
                        <option value="best">best</option>
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="formatSelect">format</label>
                    <select id="formatSelect">
                        <option value="video">video + audio</option>
                        <option value="audio">audio only</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="playlistCheckbox">
                    <label for="playlistCheckbox">download entire playlist</label>
                </div>
            </div>

            <button 
                id="downloadBtn"
                class="download-btn"
                onclick="startDownload()"
            >
                download
            </button>

            <div id="progressSection" class="progress-section" style="display: none;">
                <div class="progress-header">
                    <span id="statusText">starting download...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <div id="errorSection" class="message error" style="display: none;">
                <p id="errorText"></p>
            </div>

            <div id="successSection" class="message success" style="display: none;">
                <p id="successText"></p>
            </div>
        </div>

        <div class="footer">
            <p>all processing happens locally in your browser</p>
            <p>10 downloads per day per browser</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="canvas.js"></script>
</body>

</html>
